<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="shell top-row">
    <a class="wordmark" href="#/">Factory</a>
    <nav class="nav" aria-label="Primary">
      <a href="#/" data-nav="home">Runs</a>
      <a href="#/new" data-nav="new">New outcome</a>
    </nav>
    <div class="context" id="context" aria-live="polite"></div>
  </div>
</header>
<main class="shell" id="main" aria-live="polite"></main>
<footer class="shell foot">
  <span>Decisions are recorded under the runs directory and bind to the exact artifacts shown. Nothing here deploys or merges.</span>
</footer>
<script src="/static/app.js"></script>
</body>
</html>
