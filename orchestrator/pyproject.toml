[project]
name = "factory-orchestrator"
version = "0.1.0"
description = "Deterministic outer loop for the factory: drives Managed Agents sessions stage by stage, holds human gates, computes deterministic checks, opens GitLab MRs."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
factory = "factory.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
