# Environment for all factory sessions. One environment, many agents.
# Networking is deny-by-default: package managers and the GitLab host only.
# web_search / web_fetch are NOT governed by this (they run on Anthropic's side);
# they are disabled on every agent's toolset instead.
name: factory-cloud
config:
  type: cloud
  networking:
    type: limited
    allow_package_managers: true
    allow_mcp_servers: false
    allowed_hosts:
      - gitlab.com                      # PLACEHOLDER: replace with your self-hosted GitLab host (also set GITLAB_URL)
      # - "*.preview.example.internal"  # PLACEHOLDER: per-branch preview domain, so sessions can run test_plan.e2e
      # - dev.example.internal          # optional: dev host, if agents should be able to read it
