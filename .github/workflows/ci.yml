name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      # The one `network` test installs the sample app's dependencies from the index; the rest run offline.
      - run: python -m pytest -q -m "not network"

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.17.0"
      # From orchestrator/: ruff resolves the relative globs in a --config file against the working directory. --config
      # also gives the eval graders, which sit outside orchestrator/, the same rules.
      - run: ruff check --config pyproject.toml factory tests ../evals/graders ../evals/run_eval.py ../evals/gate.py
      # A changed agent prompt or rubric needs an eval receipt for its exact bytes: a replay of recorded sessions, or a
      # waiver with its reason (ADR-0016). Standard library only, so it runs before any install.
      - run: python ../evals/gate.py

  browser:
    name: browser runner (real Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      # The tests skip without Playwright or Chromium elsewhere; here that is the failure this job exists to catch.
      - run: python -m pytest -q tests/test_browser_runner_playwright.py
        env:
          FACTORY_REQUIRE_CHROMIUM: "1"
