<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factory sandbox check</title>
<style>body{font:18px system-ui;background:#f5f7f4;color:#173c31;margin:0;padding:24px}main{max-width:640px;margin:8vh auto;background:white;border-radius:20px;padding:24px;box-shadow:0 12px 32px #173c3110}h1{font-size:32px}form{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:0;padding:12px;font:inherit;border:1px solid #9bac9f;border-radius:8px}button{padding:12px 20px;background:#246b51;color:white;border:0;border-radius:8px;font:inherit}li{padding:12px 0}small{color:#506f60}label{display:block;margin-bottom:8px}</style>
<main><small>SYNTHETIC TEST APP · FACTORY</small><h1>A fresh place to test</h1><p>Add a task, then reload. The browser check verifies that it stays saved.</p><label for="task">Task name</label><form id="form"><input id="task" required autocomplete="off"><button>Add task</button></form><ul id="tasks" aria-live="polite"></ul></main>
<script>
const input=document.querySelector('#task'),list=document.querySelector('#tasks');
let tasks=JSON.parse(localStorage.getItem('synthetic-tasks')||'[]');
function render(){list.replaceChildren(...tasks.map(text=>{const li=document.createElement('li');li.textContent=text;return li}));}
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();tasks.push(input.value);localStorage.setItem('synthetic-tasks',JSON.stringify(tasks));input.value='';render();input.focus()});render();
</script>
</html>
